<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Container Gradient: Deep Emerald to Forest Green -->
    <linearGradient id="skBgGrad" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#086B43" />
      <stop offset="45%" stop-color="#054A2E" />
      <stop offset="100%" stop-color="#022818" />
    </linearGradient>

    <!-- Neon Rim Gradient (Lime to Cyan) -->
    <linearGradient id="skRimGrad" x1="30" y1="30" x2="482" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Leaf 3D Gradient -->
    <linearGradient id="skLeafGrad" x1="200" y1="120" x2="420" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="30%" stop-color="#10B981" />
      <stop offset="75%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Wing Gradient -->
    <linearGradient id="skGoldGrad" x1="210" y1="260" x2="410" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- River Wave Blue Gradients -->
    <linearGradient id="skWaveDeep" x1="120" y1="340" x2="200" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="skWaveLight" x1="120" y1="310" x2="200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Top Gloss Glass Reflection -->
    <linearGradient id="skGloss" x1="256" y1="20" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="skShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#011F17" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Background Rounded-Square Squircle (rx=120) -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#skBgGrad)" filter="url(#skShadow)" />

  <!-- 2. Neon Glow Rim Border -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="url(#skRimGrad)" stroke-width="6.5" stroke-opacity="0.9" />

  <!-- 3. Inner White Hairline Accent -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.12" />

  <!-- 4. Top Glass Specular Arc -->
  <path d="M 32 140 C 32 75 75 32 140 32 L 372 32 C 437 32 480 75 480 140 C 480 205 380 235 256 235 C 132 235 32 205 32 140 Z" fill="url(#skGloss)" />

  <!-- 5. THE OFFICIAL 'K' MONOGRAM EMBLEM -->
  <g id="k-official-emblem">

    <!-- A. VERTICAL STEM OF 'K' -->
    <!-- Clip path for the vertical stem to contain city silhouette & waves -->
    <clipPath id="stemClip">
      <rect x="122" y="98" width="76" height="316" rx="24" />
    </clipPath>

    <!-- White Solid Stem Base -->
    <rect x="122" y="98" width="76" height="316" rx="24" fill="#FFFFFF" />

    <!-- Stem Interior Elements (City Silhouette + River Waves) -->
    <g clip-path="url(#stemClip)">
      <!-- City / Building Skyline Silhouette in soft serene sky-blue -->
      <g fill="#93C5FD" opacity="0.85">
        <!-- Tower 1 -->
        <rect x="130" y="210" width="12" height="90" rx="2" />
        <polygon points="130,210 136,196 142,210" />
        <!-- Tower 2 (Center Spire) -->
        <rect x="146" y="195" width="15" height="105" rx="2" />
        <rect x="151" y="180" width="5" height="15" />
        <circle cx="153.5" cy="177" r="3.5" fill="#60A5FA" />
        <!-- Building 3 -->
        <rect x="165" y="222" width="14" height="78" rx="2" />
        <!-- Building Windows Micro-details -->
        <rect x="149" y="205" width="3" height="4" fill="#FFFFFF" opacity="0.9" />
        <rect x="155" y="205" width="3" height="4" fill="#FFFFFF" opacity="0.9" />
        <rect x="149" y="215" width="3" height="4" fill="#FFFFFF" opacity="0.9" />
        <rect x="155" y="215" width="3" height="4" fill="#FFFFFF" opacity="0.9" />
        <rect x="133" y="225" width="2.5" height="3.5" fill="#FFFFFF" opacity="0.9" />
        <rect x="137" y="225" width="2.5" height="3.5" fill="#FFFFFF" opacity="0.9" />
      </g>

      <!-- Water / River Waves at the bottom (Sundarbans / Rupsha River) -->
      <!-- Back Wave -->
      <path d="M 115 330 Q 140 315 160 330 T 205 325 L 205 420 L 115 420 Z" fill="url(#skWaveLight)" />
      <!-- Crest White Highlight -->
      <path d="M 115 330 Q 140 315 160 330 T 205 325" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9" />
      <!-- Front Deep Wave -->
      <path d="M 115 352 Q 145 335 170 355 T 205 348 L 205 420 L 115 420 Z" fill="url(#skWaveDeep)" />
      <!-- Front Crest Highlight -->
      <path d="M 115 352 Q 145 335 170 355 T 205 348" fill="none" stroke="#E0F2FE" stroke-width="2.5" />
    </g>

    <!-- Location-Pin on the stem (left-aligned over wave horizon) -->
    <g transform="translate(138, 282)">
      <!-- Drop Shadow of Pin -->
      <ellipse cx="14" cy="27" rx="6" ry="2.5" fill="#000000" opacity="0.3" />
      <!-- Pin Body (Green) -->
      <path d="M 14 0 C 6.27 0 0 6.27 0 14 C 0 24 14 36 14 36 C 14 36 28 24 28 14 C 28 6.27 21.73 0 14 0 Z" fill="#10B981" />
      <path d="M 14 2 C 7.37 2 2 7.37 2 14 C 2 22.8 14 33.6 14 33.6 C 14 33.6 26 22.8 26 14 C 26 7.37 20.63 2 14 2 Z" fill="#059669" />
      <!-- Pin Center White Dot -->
      <circle cx="14" cy="13" r="5" fill="#FFFFFF" />
      <circle cx="14" cy="13" r="2.5" fill="#047857" />
    </g>

    <!-- B. UPPER ARM: 3D VIBRANT SUNDARBANS GREEN LEAF -->
    <g id="leaf-arm">
      <!-- Main Leaf Body -->
      <path d="M 194 246 C 220 205 272 138 356 96 C 398 75 424 88 424 112 C 424 170 372 242 288 294 C 251 318 214 296 194 264 Z" fill="url(#skLeafGrad)" />

      <!-- Yellow-Lime Central Spine / Main Vein -->
      <path d="M 204 256 Q 292 178 388 106" fill="none" stroke="#FDE047" stroke-width="7.5" stroke-linecap="round" />

      <!-- Soft Lateral Veins -->
      <path d="M 262 214 Q 308 198 340 172 M 298 182 Q 344 156 372 130" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.65" stroke-linecap="round" />

      <!-- Leaf Gloss Reflection -->
      <path d="M 215 240 C 245 195 295 140 370 102 C 340 120 290 175 250 240 Z" fill="#FFFFFF" opacity="0.22" />

      <!-- Golden Dewdrop Beacon at Leaf Tip -->
      <circle cx="398" cy="91" r="14" fill="url(#skGoldGrad)" />
      <circle cx="398" cy="91" r="6" fill="#FFFFFF" />
    </g>

    <!-- C. LOWER ARM: GOLDEN AMBER SWOOP -->
    <g id="gold-lower-arm">
      <!-- Golden Curved Swoosh -->
      <path d="M 204 254 L 326 390 C 340 406 358 412 378 412 L 406 412 C 422 412 430 394 420 380 L 292 234 C 274 213 228 223 204 254 Z" fill="url(#skGoldGrad)" />

      <!-- White Inner Highlight Flare -->
      <path d="M 230 274 L 368 400 L 386 400 L 258 258 Z" fill="#FFFFFF" opacity="0.35" />

      <!-- Bottom Edge Gold Accent -->
      <path d="M 326 390 L 378 412 L 406 412" fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- D. CENTRAL HARMONIC CONNECTION NODE -->
    <circle cx="212" cy="249" r="20" fill="url(#skGoldGrad)" />
    <circle cx="212" cy="249" r="13" fill="#10B981" />
    <circle cx="212" cy="249" r="6" fill="#FFFFFF" />
  </g>
</svg>
