<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient: Emerald Green to Deep Forest Green -->
    <linearGradient id="kLogoBg" x1="50" y1="50" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B7A4B" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022D22" />
    </linearGradient>

    <!-- Royal Gold Accent Gradient -->
    <linearGradient id="kLogoGold" x1="60" y1="60" x2="440" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#B48B1C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Sundarbans Mangrove Leaf Gradient -->
    <linearGradient id="kLeafGrad" x1="180" y1="110" x2="420" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Specular Glass Highlight -->
    <linearGradient id="kGlassReflection" x1="256" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="kIconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#011F17" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Squircle Rounded-Square Container -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#kLogoBg)" filter="url(#kIconShadow)" />

  <!-- 2. Premium Outer Gold Rim Border -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="none" stroke="url(#kLogoGold)" stroke-width="7.5" stroke-opacity="0.85" />

  <!-- 3. Inner White Frame -->
  <rect x="38" y="38" width="436" height="436" rx="106" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.15" />

  <!-- 4. Top Glass Specular Arc -->
  <path d="M 26 130 C 26 70 70 26 130 26 L 382 26 C 442 26 486 70 486 130 C 486 195 385 225 256 225 C 127 225 26 195 26 130 Z" fill="url(#kGlassReflection)" />

  <!-- 5. ICONIC 'K' + GREEN LEAF EMBLEM -->
  <g id="k-leaf-monogram">
    <!-- Vertical Stem of 'K' -->
    <rect x="122" y="102" width="72" height="308" rx="24" fill="#FFFFFF" />

    <!-- Stem Gold Inlay Accent -->
    <rect x="135" y="118" width="11" height="276" rx="5.5" fill="url(#kLogoGold)" opacity="0.9" />

    <!-- UPPER ARM: ORGANIC VIBRANT GREEN LEAF -->
    <path d="M 190 241 C 215 200 266 138 348 97 C 389 77 415 89 415 112 C 415 169 364 241 282 292 C 246 315 210 292 190 261 Z" fill="url(#kLeafGrad)" />

    <!-- Golden Leaf Central Spine/Vein -->
    <path d="M 200 251 Q 287 174 379 107" fill="none" stroke="url(#kLogoGold)" stroke-width="9" stroke-linecap="round" />

    <!-- Delicate Side Vein Details -->
    <path d="M 256 210 Q 302 195 333 169 M 292 179 Q 338 154 364 128" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.75" stroke-linecap="round" />

    <!-- Tiny Golden Dewdrop Beacon at Leaf Tip -->
    <circle cx="389" cy="92" r="16" fill="url(#kLogoGold)" />
    <circle cx="389" cy="92" r="7" fill="#FFFFFF" />

    <!-- LOWER ARM: BOLD GEOMETRIC K LEG -->
    <path d="M 205 256 L 323 389 C 336 405 354 410 374 410 L 400 410 C 415 410 423 392 413 379 L 287 236 C 269 215 226 225 205 256 Z" fill="#FFFFFF" />

    <!-- Gold Inset on the Lower Leg -->
    <path d="M 231 277 L 364 400 L 379 400 L 256 261 Z" fill="url(#kLogoGold)" opacity="0.95" />

    <!-- Central Intersection Gold Joint Node -->
    <circle cx="213" cy="251" r="18" fill="url(#kLogoGold)" />
    <circle cx="213" cy="251" r="8" fill="#FFFFFF" />
  </g>
</svg>
